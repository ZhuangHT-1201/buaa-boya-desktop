[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buaa-boya-desktop"
version = "0.5.0"
description = "A bilingual Windows desktop controller for gap-aware BUAA Boya automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Huiteng Zhuang", email = "1610857468@qq.com" }
]
keywords = ["buaa", "boya", "automation", "windows", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Desktop Environment",
]
dependencies = [
  "autoboya>=0.1.5",
  "PyYAML>=6.0",
  "rich>=13",
  "typer>=0.12",
  "Pillow>=10.0",
  "ddddocr>=1.5.0",
]

[project.scripts]
boya-desktop = "boya_kit.launcher:main"

[tool.setuptools]
packages = ["boya_kit"]
