# Copy to config.yaml and adjust as needed. Never put passwords here.
# Passwords are stored through the operating system keyring by the desktop app or setup command.
# 复制为 config.yaml 后按需修改；不要在此写入密码。

# null = all enabled accounts / 留空表示处理全部已启用账号
username: null

# Beijing / Hangzhou / 北京 / 杭州
campus: 北京

# Only select courses for unfilled requirement slots (required - selected).
# 只选择仍有空余名额的类别（要求数 - 已选数）。
only_gap_categories: true

# Category priority order / 类别优先级
prefer_categories:
  - 德育
  - 美育
  - 劳动教育
  - 安全健康

# Categories to exclude / 永不自动选择的类别
exclude_categories:
  - 其他方面

# Automation-selected pending limit; manual courses are not counted or changed.
# 每账号机器已选未结束课程上限；人工选课不计入且不会被修改。
max_pending_selected: 4

# Decision scan, live course availability, and direct account-status intervals.
# 决策扫描、实时课程余量和账号状态刷新间隔（秒）。
poll_seconds: 60
refresh_seconds: 300
course_refresh_seconds: 30
status_refresh_seconds: 60

# true = log decisions without real operations / 测试模式
dry_run: false
